# The fwupd remote of ouroBIOS (docs/update.md#the-fwupd-remote): the
# signed metadata of the latest release, mrc and nri, for fwupdmgr update,
# GNOME Software and KDE Discover. Release candidates are not in it: they
# are in ourobios-testing.conf, off until turned on.
#
#   sudo install -m 644 configs/fwupd/ourobios.conf /etc/fwupd/remotes.d/
#   sudo install -m 644 keys/capsule-signing.pem /etc/pki/fwupd/ourobios.pem
#   sudo systemctl restart fwupd
#   fwupdmgr refresh
#
# fwupd downloads MetadataURI and MetadataURI.jcat, and loads the metadata
# only if the jcat signature is from a trusted certificate (/etc/pki/fwupd
# or /etc/pki/fwupd-metadata, one trust store); it installs a package only
# if its checksum is the one in the metadata and its own firmware.jcat is
# signed by a trusted certificate too.

[fwupd Remote]
Enabled=true
Title=ouroBIOS
MetadataURI=https://github.com/debianita22/ourobios/releases/latest/download/ourobios.xml.gz
ApprovalRequired=false
AutomaticReports=false
AutomaticSecurityReports=false
