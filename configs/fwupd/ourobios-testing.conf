# The testing remote of ouroBIOS (docs/update.md#the-fwupd-remote): the
# signed metadata of the latest release, release candidates included, from
# the assets of the fixed "testing" release, which every release replaces.
# Off by default: whoever wants the candidates turns it on, next to
# ourobios.conf (the one of the releases that are not candidates), with the
# same certificate.
#
#   sudo install -m 644 configs/fwupd/ourobios-testing.conf /etc/fwupd/remotes.d/
#   sudo install -m 644 keys/capsule-signing.pem /etc/pki/fwupd/ourobios.pem
#   sudo systemctl restart fwupd
#   sudo fwupdmgr enable-remote ourobios-testing
#
# The same version from both remotes is one package to fwupd (same .cab,
# same checksums); the candidate comes from here alone.

[fwupd Remote]
Enabled=false
Title=ouroBIOS (testing)
MetadataURI=https://github.com/debianita22/ourobios/releases/download/testing/ourobios.xml.gz
ApprovalRequired=false
AutomaticReports=false
AutomaticSecurityReports=false
