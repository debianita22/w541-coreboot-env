# Controlli veloci a ogni push e pull request: niente build delle ROM.
#   scripts   tools/ci-check.sh: shellcheck, actionlint, SHA256SUMS dei blob,
#             patches/series, chiave Optimus assente, defconfig coerenti
#   patch     coreboot al commit pinnato + patches/series, EDK2 al commit dei
#             defconfig + patches/edk2 e patches/lvglpkg, e i .config delle
#             due varianti: ogni riga dei defconfig deve restare (Kconfig la
#             lascia cadere senza errori se mancano le dipendenze)
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Script, blob e defconfig
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Strumenti
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck >/dev/null
          pip install -q --break-system-packages actionlint-py
          shellcheck --version | sed -n 2p
          actionlint -version | head -1

      - name: tools/ci-check.sh
        run: ./tools/ci-check.sh

  patches:
    name: Patch e .config su coreboot ed EDK2 pinnati
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # solo Kconfig: gcc del sistema (--toolchain host), niente crossgcc
      - name: tools/build.sh prepare config
        run: ./tools/build.sh --toolchain host prepare config

      - name: Riepilogo
        run: |
          {
            echo "### coreboot $(sed -n 's/^COREBOOT_DESCRIBE="\(.*\)"/\1/p' tools/build.sh)"
            echo
            echo "$(git -C work/coreboot log --oneline "$(sed -n 's/^COREBOOT_COMMIT="\(.*\)"/\1/p' tools/build.sh)..HEAD" | wc -l) patch applicate, .config di mrc e nri completi."
            echo "EDK2: $(grep -cv '^#' patches/edk2/series) patch su EDK2, $(grep -cv '^#' patches/lvglpkg/series) su LvglPkg."
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v7
        with:
          name: config
          path: |
            work/coreboot/build-mrc/.config
            work/coreboot/build-nri/.config
          retention-days: 14
