# La build delle due ROM e le due release.
#
#   tag vX.Y.Z o vX.Y.Z-rcN    build e release vX.Y.Z-mrc e vX.Y.Z-nri
#                              (git tag v1.0.0 && git push origin v1.0.0)
#   Run workflow, "version"    lo stesso senza tag a mano: i tag vX.Y.Z-mrc e
#                              vX.Y.Z-nri li crea la release
#   Run workflow, version      build di prova: niente release, le ROM negli
#   vuota, o push su ci-test/** artifact del run (14 giorni)
#
# Ogni release ha l'immagine completa da 12 MiB (IFD, GbE, ME, coreboot), le
# immagini dei due chip per un programmatore esterno, la capsula firmata per
# l'aggiornamento da Linux (docs/update.md) e il suo pacchetto fwupd (.cab), il
# .config, il layout e SHA256SUMS; la mrc anche i metadati firmati del remote
# fwupd (configs/fwupd/ourobios.conf), che li scarica dalla release latest.
# tools/verify-rom.sh blocca la release se i primi 5 MiB non sono
# identici a legacy/coreboot-4.22/coreboot.rom o la mappa non e' quella di
# configs/w541.fmd. La blocca anche la prova di fumo (tools/build.sh smoke):
# il payload EDK2 di ogni variante, in una ROM per QEMU q35, deve partire e
# aprire il setup, che deve rispondere ai tasti; le schermate sono
# nell'artifact smoke-<versione>. E la prova dell'aggiornamento (job
# update-test, accanto alle ROM: tools/build.sh update-test): in QEMU q35,
# con vboot a due slot e il payload EDK2 di queste patch, le capsule devono
# scrivere solo lo slot che non gira, vboot deve provarlo e tornare indietro
# se non si verifica o non parte; dal setup si torna all'altro slot, e una
# voce di boot (boot loader, sistema operativo) non puo'; seriale e
# schermate del setup nell'artifact update-test-<versione>.
#
# La capsula (e il .cab e i metadati fwupd) si firma con il secret
# CAPSULE_SIGNING_KEY (Settings -> Secrets and variables -> Actions): la
# chiave privata di keys/capsule-signing.pem, che arriva solo al passo ROM. Senza, una release vX.Y.Z si ferma; le build di
# prova escono senza capsula.
#
# Gli slot RW di vboot (docs/vboot.md) si firmano con il secret
# VBOOT_SIGNING_KEY: la chiave dati privata (firmware_data_key.vbprivk in
# base64 su una riga) di keys/vboot/firmware_data_key.vbpubk, anche lei solo
# al passo ROM. Senza, una release si ferma; le build di prova firmano con le
# chiavi di test di vboot (e le capsule delle release non si installano su
# quelle ROM).
#
# Quale release e' cosa (tools/ci.sh):
#   - mrc: RAM init con mrc.bin, come la 4.22. "latest" se non e' una
#     pre-release ed e' la versione piu' alta.
#   - nri: RAM init nativa, sempre pre-release (upstream "[NOT COMPLETE]").
#   - pre-release tutte e due con la casella "prerelease" o un trattino nella
#     versione (v1.1.0-rc1); le release vere solo dal ramo principale. Una
#     pre-release provata sul portatile diventa release senza ricostruirla:
#       gh release edit v1.0.0-mrc --repo debianita22/ourobios --prerelease=false --latest
#   - il job Release si puo' rilanciare: le bozze di un tentativo fallito si
#     cancellano e si rifanno; un tag che c'e' gia' deve essere sul commit della
#     build.
#
# Il crossgcc di coreboot (i386 con Ada, iasl, nasm: 30-60 minuti) sta nella
# cache di Actions con la chiave di "tools/build.sh toolchain-key": si
# ricostruisce solo quando il pin di coreboot cambia toolchain.
name: Build
run-name: >-
  ${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name)
  || inputs.version != '' && format('Release {0}{1}', inputs.version, (inputs.prerelease || contains(inputs.version, '-')) && ' (pre-release)' || '')
  || format('Build di prova ({0})', github.ref_name) }}

on:
  push:
    # solo la versione: i tag delle release (v1.0.0-mrc, v1.0.0-nri) non
    # combaciano e non ripartono da soli
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+']
    branches: ['ci-test/**']
  workflow_dispatch:
    inputs:
      version:
        description: "Versione da pubblicare (es. v1.0.0). Vuota: build di prova, niente release"
        type: string
        default: ""
      prerelease:
        description: "Pre-release anche la mrc (la nri lo e' sempre)"
        type: boolean
        default: false

permissions:
  contents: read

# Una release per versione alla volta: il push del tag e un Run workflow con
# la stessa versione stanno nello stesso gruppo.
concurrency:
  group: build-${{ github.ref_type == 'tag' && github.ref_name || inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    name: Versione e controlli
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      # la storia intera: una release vera deve stare sul ramo principale
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Versione
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          IN_VERSION: ${{ inputs.version }}
          IN_PRERELEASE: ${{ inputs.prerelease }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: ./tools/ci.sh version

      # gli stessi controlli di check.yml: un errore qui costa un minuto
      - name: Strumenti
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck >/dev/null
          pip install -q --break-system-packages actionlint-py
      - name: tools/ci-check.sh
        run: ./tools/ci-check.sh

      # le chiavi dei secret, solo per una release: un secret incollato male
      # si vede qui, in un minuto, non dopo la toolchain
      - name: Chiavi di firma
        if: steps.v.outputs.publish == 'true'
        env:
          CAPSULE_SIGNING_KEY: ${{ secrets.CAPSULE_SIGNING_KEY }}
          VBOOT_SIGNING_KEY: ${{ secrets.VBOOT_SIGNING_KEY }}
          VERSION: ${{ steps.v.outputs.version }}
        run: ./tools/build.sh --release --version "${VERSION}" keys

  build:
    name: ROM mrc e nri
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # gnat: Ada nel crossgcc (libgfxinit); imagemagick e uuid-dev: EDK2;
      # jcat: la firma del pacchetto fwupd; libssl-dev e pkg-config: futility
      # di vboot (libcrypto), che firma gli slot RW; qemu-system-x86: la prova
      # di fumo del payload
      - name: Pacchetti
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bison flex gnat libncurses-dev \
            zlib1g-dev m4 curl git python3 uuid-dev imagemagick jcat \
            libssl-dev pkg-config qemu-system-x86 >/dev/null
          gcc --version | head -1
          gnatmake --version | head -1

      - name: coreboot ed EDK2 pinnati, submodule, patch e blob
        run: ./tools/build.sh prepare

      - name: Chiave del crossgcc
        id: tc
        run: echo "key=$(./tools/build.sh toolchain-key)" >> "${GITHUB_OUTPUT}"

      - name: crossgcc dalla cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: work/coreboot/util/crossgcc/xgcc
          key: ${{ steps.tc.outputs.key }}

      - name: crossgcc
        run: ./tools/build.sh toolchain

      # salvato subito: una build delle ROM fallita non butta via un'ora di
      # crossgcc
      - name: crossgcc nella cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: work/coreboot/util/crossgcc/xgcc
          key: ${{ steps.tc.outputs.key }}

      - name: ROM
        env:
          CAPSULE_SIGNING_KEY: ${{ secrets.CAPSULE_SIGNING_KEY }}
          VBOOT_SIGNING_KEY: ${{ secrets.VBOOT_SIGNING_KEY }}
        run: ./tools/build.sh --release --version "${VERSION}" roms

      - name: Prova di fumo in QEMU
        run: ./tools/build.sh --release --version "${VERSION}" smoke

      - name: Schermate della prova di fumo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ needs.setup.outputs.version }}
          path: work/smoke-*/
          retention-days: 14
          if-no-files-found: ignore

      - name: Riepilogo
        run: |
          shopt -s nullglob
          {
            echo "### ${VERSION}"
            echo
            echo '```'
            (cd dist && sha256sum -- *.rom *.cap *.cab)
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v7
        with:
          name: w541-coreboot-${{ needs.setup.outputs.version }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

  # In parallelo alle ROM: lo stesso albero, il crossgcc dalla cache (lo
  # salva il job build), un payload EDK2 DEBUG e quattro ROM per q35
  update-test:
    name: Aggiornamento A/B in QEMU
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      # come il job build, senza jcat; mtools: l'ESP delle capsule su disco;
      # clang e lld: l'applicazione UEFI che fa da sistema operativo
      - name: Pacchetti
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bison flex gnat libncurses-dev \
            zlib1g-dev m4 curl git python3 uuid-dev imagemagick \
            libssl-dev pkg-config qemu-system-x86 mtools clang lld >/dev/null

      - name: coreboot ed EDK2 pinnati, submodule, patch e blob
        run: ./tools/build.sh prepare

      - name: Chiave del crossgcc
        id: tc
        run: echo "key=$(./tools/build.sh toolchain-key)" >> "${GITHUB_OUTPUT}"

      - name: crossgcc dalla cache
        uses: actions/cache/restore@v6
        with:
          path: work/coreboot/util/crossgcc/xgcc
          key: ${{ steps.tc.outputs.key }}

      - name: crossgcc
        run: ./tools/build.sh toolchain

      - name: Prova dell'aggiornamento in QEMU
        run: ./tools/build.sh update-test

      - name: Seriale della prova
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: update-test-${{ needs.setup.outputs.version }}
          path: work/update-test/out/
          retention-days: 14
          if-no-files-found: ignore

  release:
    name: Release
    needs: [setup, build, update-test]
    if: needs.setup.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.setup.outputs.version }}
      PRERELEASE: ${{ needs.setup.outputs.prerelease }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # la storia e i tag: le note elencano i commit dall'ultima release
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: w541-coreboot-${{ needs.setup.outputs.version }}
          path: dist

      - name: Controlli
        run: |
          set -eu
          cd dist
          sha256sum -c SHA256SUMS
          for v in mrc nri; do
            for f in "w541-coreboot-${VERSION}-${v}.rom" "w541-coreboot-${VERSION}-${v}-8mb-chip.rom" \
              "w541-coreboot-${VERSION}-${v}-4mb-chip.rom" "w541-coreboot-${VERSION}-${v}.cap" \
              "w541-coreboot-${VERSION}-${v}.cab" "w541-coreboot-${VERSION}-${v}.config" "w541-coreboot-${VERSION}-${v}-layout.txt"; do
              test -s "${f}" || { echo "manca ${f}"; exit 1; }
            done
            # i primi 5 MiB (IFD, GbE, ME): quelli della 4.22 (verify-rom.sh li
            # ha gia' controllati nel job build; qui sui file che si pubblicano)
            cmp -n 5242880 "w541-coreboot-${VERSION}-${v}.rom" ../legacy/coreboot-4.22/coreboot.rom
            # la capsula: la ROM di questa release, firmata dalla chiave di keys/
            python3 ../tools/update.py info --cert ../keys/capsule-signing.pem \
              --rom "w541-coreboot-${VERSION}-${v}.rom" "w541-coreboot-${VERSION}-${v}.cap"
            # il pacchetto fwupd: quella capsula, metainfo e firma jcat
            python3 ../tools/update.py info --cert ../keys/capsule-signing.pem \
              --same-as "w541-coreboot-${VERSION}-${v}.cap" "w541-coreboot-${VERSION}-${v}.cab"
          done
          # i metadati del remote fwupd (nella release mrc): firmati dalla
          # chiave di keys/, con i due .cab di questa release e nient'altro
          python3 ../tools/fwupd-cab.py check-metadata --cert ../keys/capsule-signing.pem ourobios.xml.gz \
            "w541-coreboot-${VERSION}-mrc.cab" "w541-coreboot-${VERSION}-nri.cab"
          ls -la

      - name: Pubblica
        run: ./tools/ci.sh publish dist
